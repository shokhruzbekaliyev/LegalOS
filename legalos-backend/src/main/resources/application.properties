spring.application.name=legalos-backend

# We're using the native PostgreSQL 17 install on this machine, not Docker — disable
# Spring Boot's auto Docker Compose support so it doesn't try (and fail) to launch `docker`.
# Set to true instead (or remove this line) once Docker Desktop is available.
spring.docker.compose.enabled=false

# --- Datasource (PostgreSQL) ---
# Defaults match the local native PostgreSQL 17 instance (port 5433, not the 5432 default —
# already installed on this machine) and the `legalos` role/db created for this project.
# Override via env vars for any other machine/environment (see compose.yaml for a Docker alternative).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/legalos}
spring.datasource.username=${DB_USER:legalos}
spring.datasource.password=${DB_PASSWORD:legalos_dev_pw}

# JPA never manages schema — Flyway migrations (src/main/resources/db/migration) are the source of truth.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# --- Redis (cache/queue, see compose.yaml) ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# --- JWT ---
# Dev-only default secret. MUST be overridden via env var in staging/prod.
legalos.security.jwt-secret=${JWT_SECRET:dev-only-secret-change-me}
legalos.security.jwt-expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- AI service (sherik #1's Python/FastAPI agent platform) ---
legalos.ai.base-url=${AI_SERVICE_URL:http://localhost:8000}
legalos.ai.timeout-ms=${AI_SERVICE_TIMEOUT_MS:30000}

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
